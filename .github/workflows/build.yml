name: Build EXE

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile
        run: g++ main.cpp -o program.exe

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: program
          path: program.exe
